name: Sync to Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-lfs
        run: |
          sudo apt-get update && sudo apt-get install -y git-lfs
          git lfs install
      - name: Migrate existing binaries to LFS
        run: |
          git lfs migrate import --everything --include="*.zip,*.png,*.pt,*.pth,*.gif,*.mp4"
      - name: Push to Hugging Face Space
        run: |
          git remote add space https://${{ vars.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ vars.HF_USERNAME }}/${{ vars.HF_SPACE_NAME }}
          git push --force space HEAD:main
